name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

jobs:
  build-android:
    name: Android arm64-v8a (NDK 29)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      NDK_VERSION: '29.0.14206865'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('translator/Translator.sln', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore Translator
        run: dotnet restore translator/Translator.sln

      - name: Build Translator
        run: dotnet build translator/Translator.sln -c Release --no-restore

      - name: Run Translator (generate build shards)
        shell: pwsh
        run: |
          # Use GITHUB_WORKSPACE for reliable repo root path
          $ws = $env:GITHUB_WORKSPACE
          if (-not $ws) { $ws = $PSScriptRoot; for ($i=0;$i-lt 3;$i++) { $ws = Split-Path $ws } }
          $translator = Join-Path $ws 'translator/src/Translator.Cli/bin/Release/net8.0/Translator.Cli.dll'
          $project = 'projects/nsmbw/recomp.yml'
          $logs = Join-Path $ws 'build-nsmbw/logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null

          # Verify translator exists
          if (-not (Test-Path $translator)) {
              Write-Error "Translator not found at $translator"
              Get-ChildItem (Join-Path $ws 'translator/src/Translator.Cli/bin/Release/net8.0/') -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
              throw "Translator.Cli.dll not found at expected path"
          }

          function Invoke-Step([string]$Name, [string[]]$Arguments) {
              $log = Join-Path $logs "rebuild-$Name.log"
              $ErrorActionPreference = 'Continue'
              & dotnet $translator @Arguments 2>&1 | ForEach-Object { "$_" } | Out-File -LiteralPath $log -Encoding utf8
              $code = $LASTEXITCODE
              $ErrorActionPreference = 'Stop'
              if ($code -ne 0) { Get-Content $log -Tail 30; throw "translator step '$Name' failed ($code); see $log" }
              "$Name ok"
          }

          Push-Location $ws
          try {
              Invoke-Step 'translate' @('translate-recursive', '0x80004050', '--project', $project,
                  '--outdir', 'generated/functions', '--output-metadata', 'generated/base_translation_output.json',
                  '--production-source-bundle', 'generated/base_translation_sources.bin',
                  '--no-function-files', '--prune-stale', '--threads', '6')
              Invoke-Step 'manifest' @('emit-base-manifest', '--project', $project, '--out', 'build/base',
                  '--functions-dir', 'generated/functions', '--translation-output-metadata',
                  'generated/base_translation_output.json', '--region', 'E')
              Invoke-Step 'data-init' @('generate-data-init', '--project', $project)
              Invoke-Step 'shards' @('emit-build-shards', '--project', $project, '--base-metadata',
                  'generated/base_translation_output.json', '--base-functions-dir', 'generated/functions',
                  '--native-source-dir', 'runtime/src', '--out', 'generated/build_shards')
          } finally {
              Pop-Location
          }

      - name: Install Android SDK/NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 platforms;android-28 platforms;android-30 build-tools;34.0.0 ndk;29.0.14206865'
          accept-android-sdk-licenses: 'true'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Prepare Portable Tools (LLVM-MinGW, CMake, Ninja)
        shell: pwsh
        run: ./Launcher/Prepare-PortableTools.ps1

      - name: Prepare Dependencies (Dawn prebuilt, etc.)
        shell: pwsh
        run: ./Launcher/Prepare-Dependencies-ci.ps1

      - name: Verify Game Data Exists
        shell: pwsh
        run: |
          Write-Warning "=================================================="
          Write-Warning "REQUIRED: Extracted SMNE01 rev 1 game folder at ./game/"
          Write-Warning "Generate locally: python projects/nsmbw/tools/unpack_game.py <extracted>"
          Write-Warning "Then: python projects/nsmbw/tools/prelink_rels.py"
          Write-Warning "Upload ./game folder as artifact or place in repo root"
          Write-Warning "=================================================="
          if (-not (Test-Path "game/main.dol")) {
            Write-Error "game/main.dol not found! Provide extracted game data."
            exit 1
          }
          if (-not (Test-Path "game/nsmbw_linked.rel")) {
            Write-Error "game/nsmbw_linked.rel not found! Run prelink_rels.py."
            exit 1
          }

      - name: Unpack & Prelink RELs (if game folder is raw extraction)
        shell: pwsh
        run: |
          # If game/main.dol exists but nsmbw_linked.rel doesn't, run prelink
          if (-not (Test-Path "game/nsmbw_linked.rel")) {
            python projects/nsmbw/tools/prelink_rels.py
          }

      - name: Configure Android Build
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $toolchain = Join-Path $workspace 'Launcher\artifacts\portable-tools'
          $ndk = $env:ANDROID_NDK_HOME
          $dependencies = Join-Path $workspace 'Launcher\artifacts\dependencies'
          $workspaceRoot = $workspace
          $buildDir = Join-Path $workspace 'android-build'
          $logDir = Join-Path $workspace 'build-nsmbw\logs'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $logPath = Join-Path $logDir 'configure-android.log'

          function ConvertTo-CMakePath([string]$Path) { [IO.Path]::GetFullPath($Path).Replace('\', '/') }

          if (-not (Test-Path (Join-Path $ndk 'build\cmake\android.toolchain.cmake'))) { throw "NDK missing: $ndk" }
          if (-not (Test-Path (Join-Path $dependencies 'dawn_prebuilt_android\lib\libwebgpu_dawn.a'))) {
              throw 'Dependencies\dawn_prebuilt_android is missing (pinned dawn-android-aarch64 v20260603.191052)'
          }

          # Keep the Windows compilers out of reach: only the NDK's clang may be found.
          $env:PATH = "$toolchain\CMake\bin;$toolchain\Ninja;$env:SystemRoot\System32;$env:SystemRoot"

          function ConvertTo-CMakePath([string]$Path) { [IO.Path]::GetFullPath($Path).Replace('\', '/') }

          $configure = @(
              '-S', (ConvertTo-CMakePath (Join-Path $workspaceRoot 'runtime')),
              '-B', (ConvertTo-CMakePath $buildDir),
              '-G', 'Ninja',
              "-DCMAKE_MAKE_PROGRAM=$(ConvertTo-CMakePath (Join-Path $toolchain 'Ninja\ninja.exe'))",
              "-DCMAKE_TOOLCHAIN_FILE=$(ConvertTo-CMakePath (Join-Path $ndk 'build\cmake\android.toolchain.cmake'))",
              '-DANDROID_ABI=arm64-v8a',
              # memfd_create (guest RAM) is in bionic from API 30.
              '-DANDROID_PLATFORM=android-30',
              '-DANDROID_NATIVE_API_LEVEL=30',
              '-DCMAKE_SYSTEM_VERSION=30',
              # One native library holds everything (SDL, Dawn, the game), so libc++ is linked in statically.
              '-DANDROID_STL=c++_static',
              '-DCMAKE_BUILD_TYPE=Release',
              '-DAURORA_DAWN_PROVIDER=package', '-DAURORA_SDL3_PROVIDER=vendor',
              '-DCMAKE_POLICY_DEFAULT_CMP0168=NEW', '-DFETCHCONTENT_FULLY_DISCONNECTED=ON',
              # Target ARMv8-A baseline (Cortex-A53/A73 compatible) for Kryo 265 (Snapdragon 680)
              # Avoids SIGILL from CRC32/AES/LSE/Atomics instructions not present on older ARMv8 cores
              '-DCMAKE_C_FLAGS=-march=armv8-a',
              '-DCMAKE_CXX_FLAGS=-march=armv8-a',
              "-DMKW_TRANSLATED_COMPILE_JOBS=6"
          )
          foreach ($directory in Get-ChildItem -LiteralPath $dependencies -Directory) {
              # Windows-only trees, and the Windows Dawn package (the Android one replaces it below).
              if ($directory.Name -in @('native_prebuilt', 'cppwinrt', 'dawn_prebuilt', 'dawn_prebuilt_android')) { continue }
              $configure += "-DFETCHCONTENT_SOURCE_DIR_$($directory.Name.ToUpperInvariant())=$(ConvertTo-CMakePath $directory.FullName)"
          }
          $configure += "-DFETCHCONTENT_SOURCE_DIR_DAWN_PREBUILT=$(ConvertTo-CMakePath (Join-Path $dependencies 'dawn_prebuilt_android'))"

          # Windows PowerShell 5.1 turns a native program's stderr lines into error records; CMake prints
          # ordinary status there, so run it with 'Continue' and keep the log as plain text.
          # Also output to stdout so CI logs show the error.
          $ErrorActionPreference = 'Continue'
          & (Join-Path $toolchain 'CMake\bin\cmake.exe') @configure 2>&1 |
              ForEach-Object { "$_" } | Tee-Object -FilePath $logPath -Encoding utf8
          exit $LASTEXITCODE

      - name: Build Android Native (libmain.so)
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $toolchain = Join-Path $workspace 'Launcher\artifacts\portable-tools'
          $buildDir = Join-Path $workspace 'android-build'
          $logDir = Join-Path $workspace 'build-nsmbw\logs'
          $logPath = Join-Path $logDir 'build-android.log'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $ErrorActionPreference = 'Stop'
          $env:PATH = "$toolchain\CMake\bin;$toolchain\Ninja;$env:SystemRoot\System32;$env:SystemRoot"

          $arguments = @('--build', $buildDir, '--target', 'WiiCompiled', '--parallel', 10)
          $ErrorActionPreference = 'Continue'
          & (Join-Path $toolchain 'CMake\bin\cmake.exe') @arguments 2>&1 |
              ForEach-Object { "$_" } | Tee-Object -FilePath $logPath -Encoding utf8
          exit $LASTEXITCODE

      - name: Stage Android (copy libmain.so + assets to app)
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $ndk = $env:ANDROID_NDK_HOME
          $strip = Join-Path $ndk 'toolchains\llvm\prebuilt\windows-x86_64\bin\llvm-strip.exe'
          $buildDir = Join-Path $workspace 'android-build'
          $nativeDir = Join-Path $workspace 'android\native'

          $lib = Join-Path $buildDir 'libmain.so'
          if (-not (Test-Path -LiteralPath $lib)) { throw "libmain.so is missing: $lib" }
          $libDir = Join-Path $nativeDir 'jniLibs\arm64-v8a'
          New-Item -ItemType Directory -Force $libDir | Out-Null
          $staged = Join-Path $libDir 'libmain.so'
          # Only the dynamic symbol table is needed at run time; JNI and SDL_main are found through it.
          & $strip --strip-unneeded -o $staged $lib
          if ($LASTEXITCODE -ne 0) { throw 'llvm-strip failed' }
          # Shared libraries the build made for libmain.so's own dependencies (aurora's libpng16.so). Android
          # resolves them from the app's library folder when libmain.so loads; system libraries stay out.
          Get-ChildItem -LiteralPath $buildDir -Recurse -Filter '*.so' |
              Where-Object { $_.Name -ne 'libmain.so' } | ForEach-Object {
              & $strip --strip-unneeded -o (Join-Path $libDir $_.Name) $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "llvm-strip failed for $($_.Name)" }
              "bundled $($_.Name)"
          }

          $assets = Join-Path $nativeDir 'assets\runtime'
          if (Test-Path -LiteralPath $assets) { Remove-Item -LiteralPath $assets -Recurse -Force }
          New-Item -ItemType Directory -Force $assets | Out-Null
          # initial_pipeline_cache.db: NSMBW's pipelines (projects/nsmbw/tools/make_pipeline_seed.py), built
          # at the first launch so effects don't stutter the first time they appear.
          foreach ($file in 'dsp_coef.bin', 'cacert.pem', 'initial_pipeline_cache.db') {
              Copy-Item -LiteralPath (Join-Path $buildDir $file) -Destination $assets
          }
          Copy-Item -LiteralPath (Join-Path $buildDir 'wii_bootstrap') -Destination $assets -Recurse

          '{0:N1} MB  {1}' -f ((Get-Item $staged).Length / 1MB), $staged
          Get-ChildItem $assets -Recurse -File | Measure-Object Length -Sum |
              ForEach-Object { '{0} runtime files, {1:N1} MB' -f $_.Count, ($_.Sum / 1MB) }

      - name: Build APK (Gradle)
        run: gradle -p android assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: NSMBW-Android-arm64-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30