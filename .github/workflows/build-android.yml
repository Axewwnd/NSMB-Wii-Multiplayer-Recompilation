name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

jobs:
  build-android:
    name: Android arm64-v8a (NDK 29)
    runs-on: windows-latest
    # ~39k translated functions plus the runtime and the vendored libraries on four cores.
    timeout-minutes: 300
    env:
      # Pinned NDK version - the Dawn prebuilt was built with this toolchain
      NDK_VERSION: '29.0.14206865'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('translator/Translator.sln', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache Translator Build
        uses: actions/cache@v5
        with:
          path: translator/src/Translator.Cli/bin/Release/net8.0
          key: ${{ runner.os }}-translator-build-${{ hashFiles('translator/Translator.sln', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-translator-build-

      - name: Cache Generated Shards
        uses: actions/cache@v5
        with:
          path: |
            generated/build_shards
            generated/functions
            build/base
          key: ${{ runner.os }}-shards-${{ hashFiles('projects/nsmbw/recomp.yml', 'game/main.dol', 'game/nsmbw_linked.rel') }}
          restore-keys: ${{ runner.os }}-shards-

      - name: Check if shards exist
        id: shards_check
        shell: pwsh
        run: |
          $shards = "generated/build_shards/shards.cmake"
          if (Test-Path $shards) {
              Write-Host "SHARDS_EXIST=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
              Write-Host "SHARDS_EXIST=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Restore Translator
        run: dotnet restore translator/Translator.sln

      - name: Build Translator
        run: dotnet build translator/Translator.sln -c Release --no-restore

      - name: Run Translator (generate build shards)
        if: steps.shards_check.outputs.SHARDS_EXIST != 'true'
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          if (-not $ws) { $ws = $PSScriptRoot; for ($i=0;$i-lt 3;$i++) { $ws = Split-Path $ws } }
          $translator = Join-Path $ws 'translator/src/Translator.Cli/bin/Release/net8.0/Translator.Cli.dll'
          $project = 'projects/nsmbw/recomp.yml'
          $logs = Join-Path $ws 'build-nsmbw/logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null

          if (-not (Test-Path $translator)) {
              Write-Error "Translator not found at $translator"
              Get-ChildItem (Join-Path $ws 'translator/src/Translator.Cli/bin/Release/net8.0/') -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
              throw "Translator.Cli.dll not found at expected path"
          }

          function Invoke-Step([string]$Name, [string[]]$Arguments) {
              $log = Join-Path $logs "rebuild-$Name.log"
              $ErrorActionPreference = 'Continue'
              & dotnet $translator @Arguments 2>&1 | ForEach-Object { "$_" } | Out-File -LiteralPath $log -Encoding utf8
              $code = $LASTEXITCODE
              $ErrorActionPreference = 'Stop'
              if ($code -ne 0) { Get-Content $log -Tail 30; throw "translator step '$Name' failed ($code); see $log" }
              "$Name ok"
          }

          Push-Location $ws
          try {
              Invoke-Step 'translate' @('translate-recursive', '0x80004050', '--project', $project,
                  '--outdir', 'generated/functions', '--output-metadata', 'generated/base_translation_output.json',
                  '--production-source-bundle', 'generated/base_translation_sources.bin',
                  '--no-function-files', '--prune-stale', '--threads', '6')
              Invoke-Step 'manifest' @('emit-base-manifest', '--project', $project, '--out', 'build/base',
                  '--functions-dir', 'generated/functions', '--translation-output-metadata',
                  'generated/base_translation_output.json', '--region', 'E')
              Invoke-Step 'data-init' @('generate-data-init', '--project', $project)
              Invoke-Step 'shards' @('emit-build-shards', '--project', $project, '--base-metadata',
                  'generated/base_translation_output.json', '--base-functions-dir', 'generated/functions',
                  '--native-source-dir', 'runtime/src', '--out', 'generated/build_shards')
          } finally {
              Pop-Location
          }

      - name: Install Android SDK (platforms, build-tools)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 platforms;android-28 platforms;android-30 build-tools;34.0.0'
          accept-android-sdk-licenses: 'true'

      - name: Install NDK 29.0.14206865 (pinned)
        shell: pwsh
        run: |
          $ndkVersion = '29.0.14206865'
          $ndkDir = "C:\Android\android-sdk\ndk\$ndkVersion"
          $sdkmanager = "C:\Android\android-sdk\cmdline-tools\16.0\bin\sdkmanager.bat"

          if (Test-Path "$ndkDir\build\cmake\android.toolchain.cmake") {
              Write-Host "NDK $ndkVersion already installed at $ndkDir"
          } else {
              Write-Host "Installing NDK $ndkVersion via sdkmanager..."
              & $sdkmanager "ndk;$ndkVersion"
              if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed to install NDK $ndkVersion" }
          }

          # Verify - read as single string to avoid array matching issues
          $versionFile = Join-Path $ndkDir 'source.properties'
          if (-not (Test-Path $versionFile)) { throw "NDK version file missing: $versionFile" }
          $content = [IO.File]::ReadAllText($versionFile)
          Write-Host "NDK version file: $content"
          if ($content -notmatch "Pkg\.Revision = $ndkVersion") { throw "NDK version mismatch! Expected $ndkVersion" }

          # Set ANDROID_NDK_HOME for subsequent steps
          Write-Host "ANDROID_NDK_HOME=$ndkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify NDK version
        shell: pwsh
        run: |
          $ndkPath = $env:ANDROID_NDK_HOME
          if (-not $ndkPath) { throw "ANDROID_NDK_HOME not set" }
          Write-Host "NDK path: $ndkPath"
          $versionFile = Join-Path $ndkPath 'source.properties'
          if (Test-Path $versionFile) {
              $content = Get-Content $versionFile
              Write-Host "NDK version file: $content"
              if ($content -notmatch "29\.0\.") {
                  Write-Warning "NDK version mismatch! Expected 29.x"
              }
          }

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache Portable Tools (LLVM-MinGW, CMake, Ninja)
        uses: actions/cache@v5
        with:
          path: Launcher/artifacts/portable-tools
          key: ${{ runner.os }}-portable-tools-${{ hashFiles('Launcher/Prepare-PortableTools.ps1') }}
          restore-keys: ${{ runner.os }}-portable-tools-

      - name: Prepare Portable Tools (LLVM-MinGW, CMake, Ninja)
        shell: pwsh
        run: ./Launcher/Prepare-PortableTools.ps1

      - name: Cache Dependencies (Android pinned sources)
        uses: actions/cache@v5
        with:
          path: Launcher/artifacts/dependencies
          key: ${{ runner.os }}-deps-android-${{ hashFiles('aurora-main/CMakeLists.txt', 'aurora-main/extern/CMakeLists.txt', 'aurora-main/cmake/AuroraDawnProvider.cmake', 'aurora-main/cmake/AuroraLibUSB.cmake', 'aurora-main/cmake/AuroraSDL3Provider.cmake', 'runtime/cmake/MbedTLSPin.cmake') }}
          restore-keys: ${{ runner.os }}-deps-android-

      - name: Cache Downloads (dependency archives)
        uses: actions/cache@v5
        with:
          path: artifacts/downloads
          key: ${{ runner.os }}-deps-downloads-${{ hashFiles('aurora-main/CMakeLists.txt', 'aurora-main/extern/CMakeLists.txt', 'aurora-main/cmake/AuroraDawnProvider.cmake', 'aurora-main/cmake/AuroraLibUSB.cmake', 'aurora-main/cmake/AuroraSDL3Provider.cmake', 'runtime/cmake/MbedTLSPin.cmake') }}
          restore-keys: ${{ runner.os }}-deps-downloads-

      - name: Prepare Dependencies (Android only - skip Windows deps)
        shell: pwsh
        run: |
          # Prepare Android dependencies: same as Prepare-Dependencies.ps1 but WITHOUT Windows-only packages
          # Windows-only: dawn_prebuilt (Windows), cppwinrt-tool (Windows UWP)
          # Android-specific: dawn_prebuilt_android (aarch64)
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 3.0

          $repoRoot = $env:GITHUB_WORKSPACE
          $auroraCMake = Join-Path $repoRoot 'aurora-main\CMakeLists.txt'
          $auroraExtern = Join-Path $repoRoot 'aurora-main\extern\CMakeLists.txt'
          $auroraLibUsb = Join-Path $repoRoot 'aurora-main\cmake\AuroraLibUSB.cmake'
          $auroraSdl = Join-Path $repoRoot 'aurora-main\cmake\AuroraSDL3Provider.cmake'
          $auroraDawn = Join-Path $repoRoot 'aurora-main\cmake\AuroraDawnProvider.cmake'
          $runtimeCMake = Join-Path $repoRoot 'runtime\CMakeLists.txt'

          # Android CI packages: same pins as Prepare-Dependencies.ps1 but WITHOUT Windows-only deps
          # INCLUDES dawn_prebuilt_android (pinned v20260603.191052 for aarch64)
          $packages = @(
              [pscustomobject]@{
                  Name = 'SDL'; File = 'SDL3-3.4.4.tar.gz'
                  Uris = @('https://github.com/libsdl-org/SDL/releases/download/release-3.4.4/SDL3-3.4.4.tar.gz')
                  Pins = @(@{ File = $auroraCMake; Text = 'set(AURORA_SDL3_VERSION "3.4.4"' },
                           @{ File = $auroraSdl; Text = 'releases/download/release-${AURORA_SDL3_VERSION}/SDL3-${AURORA_SDL3_VERSION}.tar.gz' })
              },
              [pscustomobject]@{
                  Name = 'abseil-cpp'; File = 'abseil-cpp-20240722.0.tar.gz'
                  Uris = @('https://github.com/abseil/abseil-cpp/archive/refs/tags/20240722.0.tar.gz')
                  Pins = @(@{ File = $auroraExtern; Text = 'https://github.com/abseil/abseil-cpp/archive/refs/tags/20240722.0.tar.gz' })
              },
              [pscustomobject]@{
                  Name = 'mbedtls'; File = 'mbedtls-3.6.7.tar.bz2'
                  Uris = @('https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.7/mbedtls-3.6.7.tar.bz2')
                  Pins = @(@{ File = (Join-Path $repoRoot 'runtime\cmake\MbedTLSPin.cmake'); Text = '3.6.7' })
              },
              [pscustomobject]@{
                  Name = 'dawn_prebuilt_android'; File = 'dawn-v20260603.191052-android-aarch64.tar.gz'
                  Uris = @('https://github.com/theofficialgman/dawn-build/releases/download/v20260603.191052/dawn-android-aarch64.tar.gz')
                  Sha256 = '0e63e8cbf53551f703f582d1306f4257c0380353f66b53369d96952ce6d9f934'
                  Pins = @(@{ File = $auroraCMake; Text = 'set(AURORA_DAWN_VERSION "v20260603.191052"' },
                           @{ File = $auroraDawn; Text = 'SHA256=0e63e8cbf53551f703f582d1306f4257c0380353f66b53369d96952ce6d9f934' })
              },
              [pscustomobject]@{
                  Name = 'fmt'; File = 'fmt-11.1.4.tar.gz'
                  Uris = @('https://github.com/fmtlib/fmt/archive/refs/tags/11.1.4.tar.gz')
                  Pins = @(@{ File = $auroraExtern; Text = 'https://github.com/fmtlib/fmt/archive/refs/tags/11.1.4.tar.gz' })
              },
              [pscustomobject]@{
                  Name = 'freetype'; File = 'freetype-2.14.3.tar.gz'
                  Uris = @('https://files.twilitrealm.dev/freetype-2.14.3.tar.gz',
                           'https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.gz',
                           'https://downloads.sourceforge.net/project/freetype/freetype2/2.14.3/freetype-2.14.3.tar.gz')
                  Pins = @(@{ File = $auroraExtern; Text = 'https://files.twilitrealm.dev/freetype-2.14.3.tar.gz' })
              },
              [pscustomobject]@{
                  Name = 'imgui'; File = 'imgui-1.91.9b-docking.tar.gz'
                  Uris = @('https://github.com/ocornut/imgui/archive/refs/tags/v1.91.9b-docking.tar.gz')
                  Pins = @(@{ File = $auroraExtern; Text = 'https://github.com/ocornut/imgui/archive/refs/tags/v1.91.9b-docking.tar.gz' })
              },
              [pscustomobject]@{
                  Name = 'libusb'; File = 'libusb-1.0.30.tar.bz2'
                  Uris = @('https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2')
                  Pins = @(@{ File = $auroraCMake; Text = 'set(AURORA_LIBUSB_VERSION "1.0.30"' },
                           @{ File = $auroraLibUsb; Text = 'releases/download/v${AURORA_LIBUSB_VERSION}/libusb-${AURORA_LIBUSB_VERSION}.tar.bz2' })
              },
              [pscustomobject]@{
                  Name = 'png'; File = 'libpng-1.6.58.tar.gz'
                  Uris = @('https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.58.tar.gz')
                  Pins = @(@{ File = $auroraExtern; Text = 'https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.58.tar.gz' })
              },
              [pscustomobject]@{
                  Name = 'sqlite3'; File = 'sqlite-amalgamation-3510300.zip'
                  Uris = @('https://sqlite.org/2026/sqlite-amalgamation-3510300.zip')
                  Pins = @(@{ File = $auroraExtern; Text = 'https://sqlite.org/2026/sqlite-amalgamation-3510300.zip' })
              },
              [pscustomobject]@{
                  Name = 'tracy'; File = 'tracy-a64b9a20294d59421a2f57aeca3c6383d8c48169.tar.gz'
                  Uris = @('https://github.com/wolfpld/tracy/archive/a64b9a20294d59421a2f57aeca3c6383d8c48169.tar.gz')
                  Pins = @(@{ File = $auroraExtern; Text = 'https://github.com/wolfpld/tracy/archive/a64b9a20294d59421a2f57aeca3c6383d8c48169.tar.gz' })
              },
              [pscustomobject]@{
                  Name = 'xxhash'; File = 'xxHash-0.8.4.tar.gz'
                  Uris = @('https://github.com/Cyan4973/xxHash/archive/refs/tags/v0.8.4.tar.gz')
                  Pins = @(@{ File = $auroraExtern; Text = 'https://github.com/Cyan4973/xxHash/archive/refs/tags/v0.8.4.tar.gz' })
              },
              [pscustomobject]@{
                  Name = 'zlib'; File = 'zlib-1.3.2.tar.gz'
                  Uris = @('https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz')
                  Pins = @(@{ File = $auroraExtern; Text = 'https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz' })
              },
              [pscustomobject]@{
                  Name = 'zstd'; File = 'zstd-1.5.7.tar.gz'
                  Uris = @('https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz')
                  Pins = @(@{ File = $auroraExtern; Text = 'https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz' })
              }
          )

          $Destination = Join-Path $repoRoot 'Launcher\artifacts\dependencies'
          $downloads = Join-Path $repoRoot 'artifacts\downloads'
          $tar = Join-Path $env:SystemRoot 'System32\tar.exe'
          if (-not (Test-Path -LiteralPath $tar -PathType Leaf)) { throw "Windows archive tool is missing: $tar" }
          [IO.Directory]::CreateDirectory($Destination) | Out-Null
          [IO.Directory]::CreateDirectory($downloads) | Out-Null

          function Assert-Pinned($Package) {
              foreach ($pin in $Package.Pins) {
                  if (-not (Test-Path -LiteralPath $pin.File -PathType Leaf)) { throw "Pin source is missing: $($pin.File)" }
                  $content = [IO.File]::ReadAllText($pin.File)
                  if (-not $content.Contains($pin.Text)) {
                      throw "$($Package.Name) is pinned to '$($pin.Text)' here but $($pin.File) no longer declares it; update both."
                  }
              }
          }

          function Get-Archive($Package) {
              $archive = Join-Path $downloads $Package.File
              if (Test-Path -LiteralPath $archive -PathType Leaf) { return $archive }
              $temporary = $archive + '.partial'
              $failures = @()
              foreach ($uri in $Package.Uris) {
                  Remove-Item -LiteralPath $temporary -Force -ErrorAction SilentlyContinue
                  Write-Host "Downloading $($Package.Name) from $uri..."
                  try {
                      Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $temporary
                  } catch {
                      $failures += "$uri ($($_.Exception.Message))"
                      continue
                  }
                  Move-Item -LiteralPath $temporary -Destination $archive -Force
                  return $archive
              }
              Remove-Item -LiteralPath $temporary -Force -ErrorAction SilentlyContinue
              throw "$($Package.Name) could not be fetched: $($failures -join '; ')"
          }

          function Expand-Package([string]$Archive, [string]$Target) {
              $extract = Join-Path (Split-Path -Parent $Target) ('.extract-' + (Split-Path -Leaf $Target))
              if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
              [IO.Directory]::CreateDirectory($extract) | Out-Null
              $listing = & $tar -tvf $Archive
              if ($LASTEXITCODE -ne 0) { throw "Listing $Archive failed with exit code $LASTEXITCODE." }
              $excludes = @($listing | ForEach-Object { if ($_ -match '^l.*\s(\S+)\s->\s') { '--exclude=' + $Matches[1] } })
              & $tar -xf $Archive -C $extract @excludes
              if ($LASTEXITCODE -ne 0) { throw "Extracting $Archive failed with exit code $LASTEXITCODE." }
              $entries = @(Get-ChildItem -LiteralPath $extract -Force)
              $source = $extract
              if ($entries.Count -eq 1 -and $entries[0].PSIsContainer) { $source = $entries[0].FullName }
              if (Test-Path -LiteralPath $Target) { Remove-Item -LiteralPath $Target -Recurse -Force }
              Move-Item -LiteralPath $source -Destination $Target
              if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
          }

          foreach ($package in $packages) {
              Assert-Pinned $package
              $target = Join-Path $Destination $package.Name
              if (Test-Path -LiteralPath $target -PathType Container) { continue }
              # For dawn_prebuilt_android use SHA256 verification + tar (Expand-Archive fails on tar.gz)
              if ($package.Name -eq 'dawn_prebuilt_android') {
                  $archive = Get-Archive $package
                  if (-not (Test-Path -LiteralPath $archive -PathType Leaf) -or
                      (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $package.Sha256) {
                      throw "$($package.Name) hash mismatch"
                  }
                  $extract = Join-Path $Destination ('.extract-' + $package.Name)
                  if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
                  [IO.Directory]::CreateDirectory($extract) | Out-Null
                  & $tar -xf $archive -C $extract
                  if ($LASTEXITCODE -ne 0) { throw "Extracting $archive failed with exit code $LASTEXITCODE." }
                  $entries = @(Get-ChildItem -LiteralPath $extract -Force)
                  $source = $extract
                  if ($entries.Count -eq 1 -and $entries[0].PSIsContainer) { $source = $entries[0].FullName }
                  if (-not (Test-Path -LiteralPath $source -PathType Container)) { throw "$($package.Name) archive layout changed." }
                  if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
                  Move-Item -LiteralPath $source -Destination $target
                  if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
              } else {
                  Expand-Package (Get-Archive $package) $target
              }
              Write-Host "Prepared $($package.Name)"
          }

          Write-Host "Pinned dependency sources ready (Android): $Destination"

      - name: Verify Game Data Exists
        shell: pwsh
        run: |
          Write-Warning "=================================================="
          Write-Warning "REQUIRED: Extracted SMNE01 rev 1 game folder at ./game/"
          Write-Warning "Generate locally: python projects/nsmbw/tools/unpack_game.py <extracted>"
          Write-Warning "Then: python projects/nsmbw/tools/prelink_rels.py"
          Write-Warning "Upload ./game folder as artifact or place in repo root"
          Write-Warning "=================================================="
          if (-not (Test-Path "game/main.dol")) {
            Write-Error "game/main.dol not found! Provide extracted game data."
            exit 1
          }
          if (-not (Test-Path "game/nsmbw_linked.rel")) {
            Write-Error "game/nsmbw_linked.rel not found! Run prelink_rels.py."
            exit 1
          }

      - name: Unpack & Prelink RELs (if game folder is raw extraction)
        shell: pwsh
        run: |
          if (-not (Test-Path "game/nsmbw_linked.rel")) {
            python projects/nsmbw/tools/prelink_rels.py
          }

      - name: Configure Android Build (original script adapted for CI)
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $toolchain = Join-Path $workspace 'Launcher\artifacts\portable-tools'
          $ndk = $env:ANDROID_NDK_HOME
          $dependencies = Join-Path $workspace 'Launcher\artifacts\dependencies'
          $workspaceRoot = $workspace
          $buildDir = Join-Path $workspace 'android-build'
          $logDir = Join-Path $workspace 'build-nsmbw\logs'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $logPath = Join-Path $logDir 'configure-android.log'

          function ConvertTo-CMakePath([string]$Path) { [IO.Path]::GetFullPath($Path).Replace('\', '/') }

          if (-not (Test-Path (Join-Path $ndk 'build\cmake\android.toolchain.cmake'))) { throw "NDK missing: $ndk" }
          if (-not (Test-Path (Join-Path $dependencies 'dawn_prebuilt_android\lib\libwebgpu_dawn.a'))) {
              throw 'Dependencies\dawn_prebuilt_android is missing (pinned dawn-android-aarch64 v20260603.191052)'
          }

          # Keep the Windows compilers out of reach: only the NDK's clang may be found.
          $env:PATH = "$toolchain\CMake\bin;$toolchain\Ninja;$env:SystemRoot\System32;$env:SystemRoot"

          $configure = @(
              '-S', (ConvertTo-CMakePath (Join-Path $workspaceRoot 'runtime')),
              '-B', (ConvertTo-CMakePath $buildDir),
              '-G', 'Ninja',
              "-DCMAKE_MAKE_PROGRAM=$(ConvertTo-CMakePath (Join-Path $toolchain 'Ninja\ninja.exe'))",
              "-DCMAKE_TOOLCHAIN_FILE=$(ConvertTo-CMakePath (Join-Path $ndk 'build\cmake\android.toolchain.cmake'))",
              '-DANDROID_ABI=arm64-v8a',
              # memfd_create (guest RAM) is in bionic from API 30.
              '-DANDROID_PLATFORM=android-30',
              # One native library holds everything (SDL, Dawn, the game), so libc++ is linked in statically.
              '-DANDROID_STL=c++_static',
              '-DCMAKE_BUILD_TYPE=Release',
              '-DAURORA_DAWN_PROVIDER=package', '-DAURORA_SDL3_PROVIDER=vendor',
              '-DCMAKE_POLICY_DEFAULT_CMP0168=NEW', '-DFETCHCONTENT_FULLY_DISCONNECTED=ON',
              # Target ARMv8-A baseline (Cortex-A53/A73 compatible) for Kryo 265 (Snapdragon 680)
              # Avoids SIGILL from CRC32/AES/LSE/Atomics instructions not present on older ARMv8 cores
              '-DCMAKE_C_FLAGS=-march=armv8-a',
              '-DCMAKE_CXX_FLAGS=-march=armv8-a',
              "-DMKW_TRANSLATED_COMPILE_JOBS=6"
          )
          foreach ($directory in Get-ChildItem -LiteralPath $dependencies -Directory) {
              # Windows-only trees, and the Windows Dawn package (the Android one replaces it below).
              if ($directory.Name -in @('native_prebuilt', 'cppwinrt', 'dawn_prebuilt', 'dawn_prebuilt_android')) { continue }
              $configure += "-DFETCHCONTENT_SOURCE_DIR_$($directory.Name.ToUpperInvariant())=$(ConvertTo-CMakePath $directory.FullName)"
          }
          $configure += "-DFETCHCONTENT_SOURCE_DIR_DAWN_PREBUILT=$(ConvertTo-CMakePath (Join-Path $dependencies 'dawn_prebuilt_android'))"
          # runtime/CMakeLists.txt declares mbedtls as "mkw_mbedtls_upstream", so the generic
          # FETCHCONTENT_SOURCE_DIR_<DIR> loop above cannot reach it; without this the interface
          # target ends up naming MbedTLS::mbedtls, which nothing defines.
          if (Test-Path -LiteralPath (Join-Path $dependencies 'mbedtls\CMakeLists.txt')) {
              $configure += "-DFETCHCONTENT_SOURCE_DIR_MKW_MBEDTLS_UPSTREAM=$(ConvertTo-CMakePath (Join-Path $dependencies 'mbedtls'))"
          } else {
              throw "Dependencies\mbedtls\CMakeLists.txt is missing (pinned mbedtls 3.6.7 source tree)"
          }

          # Windows PowerShell 5.1 turns a native program's stderr lines into error records; CMake prints
          # ordinary status there, so run it with 'Continue' and keep the log as plain text.
          $ErrorActionPreference = 'Continue'
          & (Join-Path $toolchain 'CMake\bin\cmake.exe') @configure 2>&1 |
              ForEach-Object { "$_" } | Tee-Object -FilePath $logPath -Encoding utf8
          exit $LASTEXITCODE

      - name: Build Android Native (libmain.so)
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $toolchain = Join-Path $workspace 'Launcher\artifacts\portable-tools'
          $buildDir = Join-Path $workspace 'android-build'
          $logDir = Join-Path $workspace 'build-nsmbw\logs'
          $logPath = Join-Path $logDir 'build-android.log'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $ErrorActionPreference = 'Stop'
          $env:PATH = "$toolchain\CMake\bin;$toolchain\Ninja;$env:SystemRoot\System32;$env:SystemRoot"

          $arguments = @('--build', $buildDir, '--target', 'WiiCompiled', '--parallel', 10)
          $ErrorActionPreference = 'Continue'
          & (Join-Path $toolchain 'CMake\bin\cmake.exe') @arguments 2>&1 |
              ForEach-Object { "$_" } | Tee-Object -FilePath $logPath -Encoding utf8
          exit $LASTEXITCODE

      - name: Stage Android (copy libmain.so + assets to app)
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $ndk = $env:ANDROID_NDK_HOME
          $strip = Join-Path $ndk 'toolchains\llvm\prebuilt\windows-x86_64\bin\llvm-strip.exe'
          $buildDir = Join-Path $workspace 'android-build'
          $nativeDir = Join-Path $workspace 'android\native'

          $lib = Join-Path $buildDir 'libmain.so'
          if (-not (Test-Path -LiteralPath $lib)) { throw "libmain.so is missing: $lib" }
          $libDir = Join-Path $nativeDir 'jniLibs\arm64-v8a'
          New-Item -ItemType Directory -Force $libDir | Out-Null
          $staged = Join-Path $libDir 'libmain.so'
          # Only the dynamic symbol table is needed at run time; JNI and SDL_main are found through it.
          & $strip --strip-unneeded -o $staged $lib
          if ($LASTEXITCODE -ne 0) { throw 'llvm-strip failed' }
          # Shared libraries the build made for libmain.so's own dependencies (aurora's libpng16.so). Android
          # resolves them from the app's library folder when libmain.so loads; system libraries stay out.
          Get-ChildItem -LiteralPath $buildDir -Recurse -Filter '*.so' |
              Where-Object { $_.Name -ne 'libmain.so' } | ForEach-Object {
              & $strip --strip-unneeded -o (Join-Path $libDir $_.Name) $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "llvm-strip failed for $($_.Name)" }
              "bundled $($_.Name)"
          }

          $assets = Join-Path $nativeDir 'assets\runtime'
          if (Test-Path -LiteralPath $assets) { Remove-Item -LiteralPath $assets -Recurse -Force }
          New-Item -ItemType Directory -Force $assets | Out-Null
          # initial_pipeline_cache.db: NSMBW's pipelines (projects/nsmbw/tools/make_pipeline_seed.py), built
          # at the first launch so effects don't stutter the first time they appear.
          foreach ($file in 'dsp_coef.bin', 'cacert.pem', 'initial_pipeline_cache.db') {
              Copy-Item -LiteralPath (Join-Path $buildDir $file) -Destination $assets
          }
          Copy-Item -LiteralPath (Join-Path $buildDir 'wii_bootstrap') -Destination $assets -Recurse

          '{0:N1} MB  {1}' -f ((Get-Item $staged).Length / 1MB), $staged
          Get-ChildItem $assets -Recurse -File | Measure-Object Length -Sum |
              ForEach-Object { '{0} runtime files, {1:N1} MB' -f $_.Count, ($_.Sum / 1MB) }

      - name: Verify ARMv8-A baseline in libmain.so
        shell: pwsh
        run: |
          $ndk = $env:ANDROID_NDK_HOME
          $objdump = Join-Path $ndk 'toolchains\llvm\prebuilt\windows-x86_64\bin\llvm-objdump.exe'
          $lib = Join-Path $env:GITHUB_WORKSPACE 'android\native\jniLibs\arm64-v8a\libmain.so'
          if (-not (Test-Path -LiteralPath $objdump)) { throw "llvm-objdump is missing: $objdump" }
          if (-not (Test-Path -LiteralPath $lib)) { throw "libmain.so is missing: $lib" }
          # Kryo 265 (Cortex-A73/A53, Snapdragon 680) implements neither the ARMv8.1 LSE atomics
          # nor the ARMv8.2 RCpc loads: one of these in libmain.so is a guaranteed SIGILL there.
          $pattern = '^\s*[0-9a-f]+:\s+(cas|ldadd|ldclr|ldeor|ldset|ldsmax|ldsmin|ldumax|ldumin|swp|ldapr)[abhl]*(\s|$)'
          $hits = @(& $objdump -d --no-show-raw-insn $lib | Select-String -Pattern $pattern)
          if ($hits.Count -gt 0) {
              $hits | Select-Object -First 10 | ForEach-Object { Write-Host $_.Line.Trim() }
              throw "libmain.so holds $($hits.Count) ARMv8.1+/ARMv8.2 instruction(s) that SIGILL on Kryo 265"
          }
          Write-Host 'OK: libmain.so stays on the ARMv8-A baseline (no LSE atomics, no RCpc loads)'

      - name: Setup Gradle 8.7 (AGP 8.5.2)
        uses: gradle/actions/setup-gradle@v4
        with:
          # The runner ships Gradle 9.x, which AGP 8.5.2 does not support.
          gradle-version: '8.7'

      - name: Build APK (Gradle)
        run: gradle -p android assembleRelease

      - name: Report APK checksum
        shell: pwsh
        run: |
          $apk = Join-Path $env:GITHUB_WORKSPACE 'android\app\build\outputs\apk\release\app-release.apk'
          if (-not (Test-Path -LiteralPath $apk)) { throw "APK is missing: $apk" }
          $file = Get-Item -LiteralPath $apk
          $hash = (Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          $info = '{0:N1} MB  {1}' -f ($file.Length / 1MB), $apk
          Write-Host $info
          Write-Host "APK SHA-256: $hash"
          $info | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "APK SHA-256: $hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: NSMBW-Android-arm64-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30