name: In-game bug report
description: Something looks, sounds, or behaves wrong (graphics, audio, controls, LAN play) - but the game doesn't crash.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Where to find your logs:**
        - **Windows:** `Documents\MarioWiiSaveData\Logs`
        - **Linux:** `~/.local/share/WiiCompiled/Logs`
        - **Android:** connect the phone to a computer with a USB cable and open `Android/data/com.wither.nsmbw/files/Logs`

        Every run gets its own folder. Open the **newest** one and attach `console.log`.

        For visual bugs, a screenshot or short clip helps enormously.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you continue
      options:
        - label: I'm on the latest release.
          required: true
        - label: I searched the existing issues and nobody has reported this yet.
          required: true
        - label: The problem does NOT also happen on Dolphin or a real Wii (if it does, it's how the game itself behaves).
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you downloaded (it's in the file name).
      placeholder: "e.g. 0.1.2"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: What kind of bug is it?
      options:
        - Graphics / visual glitch
        - Audio
        - Controls (touch, keyboard, controller)
        - LAN play
        - Gameplay behaves differently than on Wii/Dolphin
        - Saves / settings
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens?
      description: Describe the bug and what you expected instead.
      placeholder: "e.g. The lava in World 1's castle flickers black…"
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: What were you doing? / How to reproduce
      description: Which world and level, and exact steps if you can reproduce it.
      placeholder: |
        1. Enter World 1-Castle
        2. …
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshot / video
      description: Drag & drop images or clips here (very helpful for visual bugs).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach `console.log` from your newest run folder, or paste the relevant part below.
      render: text
  - type: input
    id: device
    attributes:
      label: Device
      description: Phone model, or the PC's CPU and GPU (with the driver version).
      placeholder: "e.g. Pixel 7 / Ryzen 5 5600 + RTX 3060, driver 560.94"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: "e.g. Android 14 / Windows 11 24H2 / Fedora 44"
    validations:
      required: true
