name: Crash / freeze report
description: The game crashed, froze, or closed on its own.
title: "[Crash] "
labels: ["crash"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Crashes are almost impossible to fix without logs, so please fill this in fully.

        **Where to find your logs:**
        - **Windows:** `Documents\MarioWiiSaveData\Logs` (paste `%USERPROFILE%\Documents\MarioWiiSaveData\Logs` into the File Explorer address bar)
        - **Linux:** `~/.local/share/WiiCompiled/Logs`
        - **Android:** connect the phone to a computer with a USB cable and open `Android/data/com.wither.nsmbw/files/Logs`

        Every run gets its own folder. Open the **newest** one and attach (drag & drop) `console.log` and any `crash_*.txt` file from it.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you continue
      options:
        - label: I'm on the latest release.
          required: true
        - label: I searched the existing issues and nobody has reported this crash yet.
          required: true
        - label: My game is New Super Mario Bros. Wii, USA (SMNE01), revision 1.
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you downloaded (it's in the file name).
      placeholder: "e.g. 0.1.2"
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: When does it crash?
      options:
        - During startup, before the title screen
        - On the title screen or the file select
        - On the world map
        - While loading a level
        - During a level
        - In a LAN game
        - Randomly / no clear pattern
    validations:
      required: true
  - type: dropdown
    id: repro
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Most of the time
        - Sometimes
        - Happened only once so far
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: What were you doing when it crashed?
      description: Which world and level, how many players, which power-up, anything you pressed right before. The more specific, the better.
      placeholder: "e.g. World 3-4 with two players, it froze when Luigi picked up a propeller mushroom…"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can make it crash on purpose, list the steps.
      placeholder: |
        1. Start the game
        2. …
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag & drop `console.log` and any `crash_*.txt` from your newest run folder here, or paste the end of them below.
      render: text
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: Phone model, or the PC's CPU and GPU (with the driver version).
      placeholder: "e.g. Pixel 7 / Ryzen 5 5600 + RTX 3060, driver 560.94"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: "e.g. Android 14 / Windows 11 24H2 / Fedora 44"
    validations:
      required: true
