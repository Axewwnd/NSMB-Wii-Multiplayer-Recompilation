name: Setup problem
description: Installing, importing the game files, or starting the game for the first time doesn't work.
title: "[Setup] "
labels: ["setup"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [Getting the game files](https://github.com/WitherBlitz/NSMB-Wii-Multiplayer-Recompilation#getting-the-game-files) first: most setup problems are a different region or revision of the game, or a disc image instead of the extracted folder.

        If the game starts but stops early, attach `console.log` from the newest folder in:
        - **Windows:** `Documents\MarioWiiSaveData\Logs`
        - **Linux:** `~/.local/share/WiiCompiled/Logs`
        - **Android:** `Android/data/com.wither.nsmbw/files/Logs` (connect the phone to a computer with a USB cable)
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you continue
      options:
        - label: I'm on the latest release.
          required: true
        - label: I searched the existing issues and nobody has reported this yet.
          required: true
        - label: My game is New Super Mario Bros. Wii, USA (SMNE01), revision 1, extracted with Dolphin's Extract Entire Disc.
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where does it go wrong?
      options:
        - Installing the app / extracting the download
        - Importing or choosing the game files
        - The game won't start after that
        - After updating from an older version
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens?
      description: The exact error message (copy the full text or screenshot it) and what you were doing when it appeared.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach `console.log` from the newest run folder if there is one.
      render: text
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "e.g. Galaxy S23 / Ryzen 5 5600 + RTX 3060"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: "e.g. Android 14 / Windows 11 24H2 / Fedora 44"
    validations:
      required: true
